[tox]
envlist = py{312}-django{42,52}-drf{latest}, quality, docs
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = make
commands =
    make test PYTEST_ARGS="{posargs}"

[testenv:quality]
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}
dependency_groups = quality
allowlist_externals =
    make
commands =
    make quality

[testenv:docs]
runner = uv-venv-lock-runner
changedir = docs
dependency_groups = docs
allowlist_externals =
    make
commands =
    make html

[pycodestyle]
max-line-length = 120
exclude=.git,migrations,.venv,.tox,docs
